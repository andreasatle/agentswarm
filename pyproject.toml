[project]
name = "agentswarm"
version = "0.1.0"
description = "Loosely coupled agent teams that mature git-versioned artifacts toward a north star"
readme = "README.md"
authors = [
    { name = "Andreas Atle", email = "atle.andreas@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-core>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
ollama = [
    "langchain-ollama>=1.1.0",
]
openai = [
    "langchain-openai>=1.6.7",
]
anthropic = [
    "langchain-anthropic>=1.7.5",
]

[project.scripts]
agentswarm = "agentswarm.cli:Cli.main"

[build-system]
requires = ["uv_build>=0.8.5,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# NewType "constructors" return their argument unchanged, so they are safe as defaults.
extend-immutable-calls = [
    "agentswarm.core.domain.ArtifactId",
    "agentswarm.core.domain.TeamName",
    "agentswarm.core.domain.Level",
    "agentswarm.core.domain.ProjectId",
    "agentswarm.core.domain.DecisionId",
]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "docker: needs a running Docker daemon (skipped otherwise)",
    "live: calls a real model (skipped unless AGENTSWARM_LIVE_MODEL is set)",
    "jev: calls the real Jev API (skipped unless TYPESAFE_API_KEY and AGENTSWARM_JEV_MODEL are set)",
]
