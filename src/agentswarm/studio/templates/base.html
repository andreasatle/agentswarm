<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}AgentSwarm studio{% endblock %}</title>
<link rel="stylesheet" href="/static/studio.css">
<script src="/static/studio.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="/"><span class="mark" aria-hidden="true"></span>AgentSwarm <span>studio</span></a>
  <nav>
    <a href="/"{% if active == "runs" %} aria-current="page"{% endif %}>Runs</a>
    <a href="/board">Board</a>
    <a class="button primary" href="/new">New run</a>
  </nav>
</header>
<main class="page">
{% block main %}{% endblock %}
</main>
</body>
</html>
