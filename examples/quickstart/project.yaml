# The smallest project that runs anywhere: no model, no Jev, no Docker. A fake executor writes each task to
# a Markdown file, and the gate checks that every Markdown file has text before it merges.
#
#   uv run agentswarm run examples/quickstart/project.yaml --root ~/agentswarm-runs/quickstart --task "Write a note"
project: quickstart
domain: software
north_star: Notes that say something.
seed: seed

levels: [raw, experimental]
sandbox: {kind: local}   # runs checks on this machine: fine here, the fake executor writes no code

checks:
  notes_have_text:
    command: [python3, -c, "import pathlib, sys; sys.exit(any(p.stat().st_size == 0 for p in pathlib.Path().glob('*.md')))"]
    kind: test_failure

teams:
  - {use: fake_executor, watches: raw}

gates:
  - {from: raw, to: experimental, hard_checks: [notes_have_text]}
