# A newcomer's guide to a few research papers, reviewed from four perspectives (docs/design/documents.md).
# The papers' full text are the sources; their Qasper questions, written by people who read only each paper's
# title and abstract, are hidden: a reader model answers them from the guide alone, and that is the score.
#   uv run agentswarm import-guide ~/agentswarm-data/qasper/qasper-test-v0.3.json --out ~/agentswarm-data/guide \
#     --topic "<the papers' common topic>" --papers <id> <id> ...
#   uv run agentswarm run examples/guide/project.yaml --root ~/agentswarm-runs/guide --max-rounds 200 \
#     --task "Write the guide that docs/brief.md describes"
# The same guide reviewed by one broad reviewer instead is the baseline at equal cost (examples/guide/baseline.yaml).
project: guide
domain: document
north_star: >-
  A guide that lets a newcomer understand what each paper in sources/ set out to do, how, and what it found, and
  how the papers relate, as docs/brief.md describes it; every fact from the papers, cited.
seed: ~/agentswarm-data/guide10/seed
levels: [draft, reviewed]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}
models:
  # The writer's family (Anthropic, OpenAI by the router) differs from the referee's and the grader's (DeepSeek).
  planner: {model: "anthropic:claude-sonnet-5-5", max_tokens: 16384, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}}
  haiku55: {api_key_env: OPENROUTER_API_KEY, base_url: 'https://openrouter.ai/api/v1', max_tokens: 32768, model: 'openai:anthropic/claude-haiku-5.5', usd_per_million: {cache_read: 0.01, input: 0.1, output: 0.5}}
  gpt-sol: {model: "openai:gpt-6.1-sol", max_tokens: 32768, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.1}}
  referee: {api_key_env: OPENROUTER_API_KEY, base_url: 'https://openrouter.ai/api/v1', max_tokens: 16384, model: 'openai:deepseek/deepseek-v4-pro-0813', usd_per_million: {cache_read: 0.022, input: 0.66, output: 1.98}}
  # The scorer's own entries, at temperature 0: a reading at the default varied by about two questions in 22 on
  # the same text (2026-10-16); each question is also decided by the majority of three readings (`votes`).
  reader: {api_key_env: OPENROUTER_API_KEY, base_url: 'https://openrouter.ai/api/v1', max_tokens: 4096, temperature: 0, model: 'openai:anthropic/claude-haiku-5.5', usd_per_million: {cache_read: 0.01, input: 0.1, output: 0.5}}
  grader: {api_key_env: OPENROUTER_API_KEY, base_url: 'https://openrouter.ai/api/v1', max_tokens: 4096, temperature: 0, model: 'openai:deepseek/deepseek-v4-pro-0813', usd_per_million: {cache_read: 0.022, input: 0.66, output: 1.98}}
checks:
  check_doc: {command: [python, tools/check_doc.py], kind: build_failure, timeout_s: 60}
teams:
  - {use: outliner, watches: draft, model: planner}
  - use: writer
    watches: draft
    model_tiers: [haiku55, gpt-sol]  # ranked by the router
    routing: {ledger: ~/agentswarm-data/routing.sqlite, target: 0.8, half_life_calls: 200, explore_usd: 1.0}
    checks: [check_doc]
    max_model_calls: 40
    attempts: 2
    climb: true
    repairs: 2
    constraints:
      - "docs/brief.md says what the guide is for, who reads it and its rules; sources/ holds the papers, the only source of facts."
      - "Cite every factual statement with the paper it comes from, like [@1909.00694], naming a file in sources/ without its extension."
gates:
  - {from: draft, to: reviewed, hard_checks: [check_doc]}
questions: {path: ~/agentswarm-data/guide10/held_out/questions.json, reader: reader, grader: grader, votes: 3}
review:
  model: gpt-sol
  referee: referee
  perspectives: [facts, coverage, reader, consistency]
budgets: {usd_per_day: 0.82, reserve_usd: 0.05}  # 2026-10-16, second try (a reference guide): $0.50 per review arm on top of the copied build ($0.32), within the $5 approved
supervisor: {stall_after_minutes: 60}
jev: {mode: shadow, active: ["size:*", "split:*", "join:*"]}  # the outliner splits the guide into sections
