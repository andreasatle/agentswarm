# A sanity setup (Phase 8): the whole pipeline on qwen2.5-coder 14b. It answers probes well but, on Ollama,
# describes tool calls instead of making them: the executor escalates every task with "made no changes".
# The executor builds on raw, the gate runs the unit tests, and a red team reviews what reaches experimental.
project: goldilocks
domain: software
north_star: A small, well-tested Python greeting library.
seed: ../greeter/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}

models:
  coder: {model: "ollama:qwen2.5-coder:14b", temperature: 0, max_tokens: 16384}
teams:
  - use: executor
    watches: raw
    model: coder
    checks: [unit_tests]
    max_model_calls: 30
    constraints: [Use only the Python standard library., Put tests in tests/ and run them with run_checks.]
  - {use: red_team, watches: experimental, model: coder, checks: [unit_tests]}
gates:
  - {from: raw, to: experimental, hard_checks: [unit_tests]}

jev: {mode: shadow}
