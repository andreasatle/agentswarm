# Phase 8 review comparison: planted bugs in the held-out tasks' references, and clean controls.
#   uv run agentswarm compare examples/goldilocks/review.yaml --workdir ~/agentswarm-runs/goldilocks/review
suite: ../greeter/evaluation/heldout/suite.yaml
kind: review
bugs_per_task: 1
# Every second task in suite order (half the suite, to keep the run to a few hours; not hand-picked).
tasks: [reverse-name, whisper, oxford-group, short-hello, weekday, hello-json, palindrome, padded]
setups:
  broad-small: review-broad-small.yaml
  narrow-small: review-narrow-small.yaml
  broad-big: review-broad-big.yaml
