# The atomic benchmark (Phase 8 revision): one prompt, one answer, scored by plain code. No tools, no loop.
#   uv run agentswarm probe examples/goldilocks/probe.yaml --workdir ~/agentswarm-runs/goldilocks/probe
# 52 tasks; per task a produce probe, a clean critique and two planted bugs: about 200 probes per model.
# Models run one at a time, so each loads once; a rerun resumes where it stopped.
suites:
  - ../greeter/evaluation/suite.yaml
  - ../greeter/evaluation/hard/suite.yaml
  - ../greeter/evaluation/heldout/suite.yaml
  - ../greeter/evaluation/complex/suite.yaml
kinds: [produce, critique]
bugs_per_task: 2
constraints: [Use only the Python standard library.]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}
models:  # each fits in 24 GB alone; 32k context (the Ollama default here); output capped, thinking included
  gemma4-e4b: {model: "ollama:gemma4:e4b", temperature: 0, max_tokens: 16384}
  qwen-7b: {model: "ollama:qwen2.5-coder:7b", temperature: 0, max_tokens: 16384}
  llama-8b: {model: "ollama:llama3.1:8b", temperature: 0, max_tokens: 16384}
  gemma4-12b: {model: "ollama:gemma4:12b", temperature: 0, max_tokens: 16384}
  qwen-14b: {model: "ollama:qwen2.5-coder:14b", temperature: 0, max_tokens: 16384}
  gemma4-26b: {model: "ollama:gemma4:26b", temperature: 0, max_tokens: 16384}
  # Hosted, three sizes per provider (prices in US dollars per million tokens, 2026-10-05). Sonnet 5.5,
  # Opus 5.5 and the GPT-6 models reject `temperature`, so none is set; their reasoning effort is the default.
  claude-haiku: {model: "anthropic:claude-haiku-4-5", max_tokens: 16384, usd_per_million: {input: 1.0, output: 5.0, cache_read: 0.1, cache_write: 1.25}}
  claude-sonnet: {model: "anthropic:claude-sonnet-5-5", max_tokens: 16384, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}}
  claude-opus: {model: "anthropic:claude-opus-5-5", max_tokens: 16384, usd_per_million: {input: 4.0, output: 20.0, cache_read: 0.2, cache_write: 5.0}}
  gpt-luna: {model: "openai:gpt-6-luna", max_tokens: 16384, usd_per_million: {input: 0.10, output: 0.50}}
  gpt-sol: {model: "openai:gpt-6.1-sol", max_tokens: 16384, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.1}}
  gpt-astra: {model: "openai:gpt-6-astra", max_tokens: 16384, usd_per_million: {input: 10.0, output: 50.0}}
