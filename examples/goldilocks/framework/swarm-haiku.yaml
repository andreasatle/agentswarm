# Framework experiment, setup "swarm-haiku": haiku-accept plus AgentSwarm's own parts, on the same capable model, so
# any difference comes from them and not from a model too small for a role. A decomposer splits tasks Jev doesn't
# clearly judge small (p(fits) at most 0.7; Jev active only at the size point), Sonnet writes each leaf's acceptance
# tests, Haiku builds (one attempt, as in haiku-accept), and the gate runs the tests. The children of a split go in
# order, each from what the earlier ones merged. The three narrow red teams are off: in the first smoke run they
# spent 90% of the tokens and found nothing (phase-8-goldilocks.md); they return where a check shows they find bugs.
project: inventory
domain: software
north_star: A small, reliable inventory tool with a Python API and a command line.
seed: ../../inventory/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}
models:
  builder: {model: "anthropic:claude-haiku-4-5", max_tokens: 16384, usd_per_million: {input: 1.0, output: 5.0, cache_read: 0.1, cache_write: 1.25}}
  tester: {model: "anthropic:claude-sonnet-5-5", max_tokens: 16384, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}}
teams:
  - {use: decomposer, watches: raw, model: builder, split_below: 0.7, max_depth: 1, build_at_max_depth: true}
  - {use: acceptance_tester, watches: raw, model: tester, checks: [unit_tests]}
  - use: executor
    watches: raw
    model: builder
    checks: [unit_tests]
    max_model_calls: 60
    constraints: [Use only the Python standard library., Put tests in tests/ and run them with run_checks.]
gates:
  - {from: raw, to: experimental, hard_checks: [unit_tests]}
jev: {mode: shadow, active: ["size:*"]}  # the split check is logged only: its threshold is uncalibrated
