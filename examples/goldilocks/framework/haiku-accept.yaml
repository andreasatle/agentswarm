# Framework experiment, setup "haiku-accept": the acceptance experiment's best setup, run again: Sonnet writes the
# acceptance tests, Haiku builds against them. The baseline swarm-haiku must beat; a rerun also shows run-to-run spread.
project: inventory
domain: software
north_star: A small, reliable inventory tool with a Python API and a command line.
seed: ../../inventory/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}
models:
  builder: {model: "anthropic:claude-haiku-4-5", max_tokens: 16384, usd_per_million: {input: 1.0, output: 5.0, cache_read: 0.1, cache_write: 1.25}}
  tester: {model: "anthropic:claude-sonnet-5-5", max_tokens: 16384, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}}
teams:
  - {use: acceptance_tester, watches: raw, model: tester, checks: [unit_tests]}
  - use: executor
    watches: raw
    model: builder
    checks: [unit_tests]
    max_model_calls: 60
    constraints: [Use only the Python standard library., Put tests in tests/ and run them with run_checks.]
gates:
  - {from: raw, to: experimental, hard_checks: [unit_tests]}
jev: {mode: shadow}
