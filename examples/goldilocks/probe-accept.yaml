# Which models write good acceptance tests? (acceptance-checks.md, step 1)
# A model writes a task's acceptance tests before anyone builds it; right tests pass on the reference,
# fail on the untouched seed, and catch planted bugs. Hosted models first; local ones when the GPU is free.
#   uv run agentswarm probe examples/goldilocks/probe-accept.yaml --workdir ~/agentswarm-runs/probe-accept
suites: [../inventory/evaluation/suite.yaml]
kinds: [accept]
bugs_per_task: 2
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}
models:
  claude-haiku: {model: "anthropic:claude-haiku-4-5", max_tokens: 16384, usd_per_million: {input: 1.0, output: 5.0}}
  claude-sonnet: {model: "anthropic:claude-sonnet-5-5", max_tokens: 16384, usd_per_million: {input: 2.0, output: 10.0}}
