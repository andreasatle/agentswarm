# Complexity experiment, setup "swarm-small": AgentSwarm with the same small model. A decomposer splits tasks
# that are too big (Jev decides, active only at the size and split points), the executor builds, the gate runs
# the tests, and three narrow red teams review merged work; what they prove becomes fix tasks.
project: inventory
domain: software
north_star: A small, reliable inventory tool with a Python API and a command line.
seed: ../../inventory/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}

models:
  small: {model: "ollama:gemma4:e4b", temperature: 0, max_tokens: 16384}
teams:
  - {use: decomposer, watches: raw, model: small}
  - use: executor
    watches: raw
    model: small
    checks: [unit_tests]
    max_model_calls: 60
    constraints: [Use only the Python standard library., Put tests in tests/ and run them with run_checks.]
  - {use: contract_tester, watches: experimental, model: small, checks: [unit_tests]}
  - {use: error_tester, watches: experimental, model: small, checks: [unit_tests]}
  - {use: edge_value_tester, watches: experimental, model: small, checks: [unit_tests]}
gates:
  - {from: raw, to: experimental, hard_checks: [unit_tests]}

jev: {mode: shadow, active: ["size:*", "split:*"]}
