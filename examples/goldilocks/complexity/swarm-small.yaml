# Complexity experiment, setup "swarm-small": small-3 plus AgentSwarm's own parts, so any difference comes from
# them. A decomposer splits tasks Jev doesn't clearly judge small (p(fits) at most 0.7; Jev active only at the
# size point), the executor builds with up to 3 attempts, the gate runs the tests, and three narrow
# red teams review merged work; what they prove becomes fix tasks.
project: inventory
domain: software
north_star: A small, reliable inventory tool with a Python API and a command line.
seed: ../../inventory/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}

models:
  small: {model: "ollama:gemma4:e4b", temperature: 0.7, max_tokens: 16384}
teams:
  - {use: decomposer, watches: raw, model: small, split_below: 0.7, max_depth: 1}  # split once at most
  - use: executor
    watches: raw
    model: small
    attempts: 3
    checks: [unit_tests]
    max_model_calls: 60
    constraints: [Use only the Python standard library., Put tests in tests/ and run them with run_checks.]
  - {use: contract_tester, watches: experimental, model: small, checks: [unit_tests]}
  - {use: error_tester, watches: experimental, model: small, checks: [unit_tests]}
  - {use: edge_value_tester, watches: experimental, model: small, checks: [unit_tests]}
gates:
  - {from: raw, to: experimental, hard_checks: [unit_tests]}

jev: {mode: shadow, active: ["size:*"]}  # the split check is logged only: its threshold is uncalibrated
# One slow local model works through every child in turn, so waiting is not stalling.
supervisor: {stall_after_minutes: 240}
