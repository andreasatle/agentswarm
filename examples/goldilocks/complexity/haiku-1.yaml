# Complexity experiment, setup "haiku-1": the larger model, one attempt per task. The baseline.
project: inventory
domain: software
north_star: A small, reliable inventory tool with a Python API and a command line.
seed: ../../inventory/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}

models:
  large: {model: "anthropic:claude-haiku-4-5", max_tokens: 16384, usd_per_million: {input: 1.0, output: 5.0}}
teams:
  - use: executor
    watches: raw
    model: large
    checks: [unit_tests]
    max_model_calls: 60
    constraints: [Use only the Python standard library., Put tests in tests/ and run them with run_checks.]
gates:
  - {from: raw, to: experimental, hard_checks: [unit_tests]}

jev: {mode: shadow}
