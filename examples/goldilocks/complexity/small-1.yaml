# Complexity experiment, setup "small-1": the small model, one attempt per task. How big is the gap?
project: inventory
domain: software
north_star: A small, reliable inventory tool with a Python API and a command line.
seed: ../../inventory/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}

models:
  small: {model: "ollama:gemma4:e4b", temperature: 0, max_tokens: 16384}
teams:
  - use: executor
    watches: raw
    model: small
    checks: [unit_tests]
    max_model_calls: 60
    constraints: [Use only the Python standard library., Put tests in tests/ and run them with run_checks.]
gates:
  - {from: raw, to: experimental, hard_checks: [unit_tests]}

jev: {mode: shadow}
