# Smoke run of the framework experiment (one task per level) before the full run: what do AgentSwarm's own parts (decomposition, red teams, fix tasks) add when every role
# has a capable model? A failure with a model too small for a role says nothing about the framework, so this comes
# before tuning smaller models. Both setups use Haiku to build and Sonnet's acceptance tests; scored by hidden tests.
#   uv run agentswarm compare examples/goldilocks/framework-smoke.yaml --workdir ~/agentswarm-runs/framework-smoke
#   uv run agentswarm compare examples/goldilocks/framework.yaml --workdir ~/agentswarm-runs/framework
suite: ../inventory/evaluation/suite.yaml
order: by_task
tasks: [search, pricing, report-sort, alerts, fifo]  # one per level
setups:
  haiku-accept: framework/haiku-accept.yaml
  swarm-haiku: framework/swarm-haiku.yaml
