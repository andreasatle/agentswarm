# A quick check of the atomic benchmark: three tasks, every model.
#   uv run agentswarm probe examples/goldilocks/probe-smoke.yaml --workdir ~/agentswarm-runs/goldilocks/probe-smoke
# One easy, one hard and one complex task: 4 probes each, 12 per model.
# Models run one at a time, so each loads once; a rerun resumes where it stopped.
suites:
  - ../greeter/evaluation/suite.yaml
  - ../greeter/evaluation/hard/suite.yaml
  - ../greeter/evaluation/heldout/suite.yaml
  - ../greeter/evaluation/complex/suite.yaml
kinds: [produce, critique]
tasks: [farewell, greeting-book, greetbook]
bugs_per_task: 2
constraints: [Use only the Python standard library.]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}
models:                                   # every one fits in 24 GB on its own; context_window is 32k (Ollama)
  gemma4-e4b: {model: "ollama:gemma4:e4b", temperature: 0}
  qwen-7b: {model: "ollama:qwen2.5-coder:7b", temperature: 0}
  llama-8b: {model: "ollama:llama3.1:8b", temperature: 0}
  gemma4-12b: {model: "ollama:gemma4:12b", temperature: 0}
  qwen-14b: {model: "ollama:qwen2.5-coder:14b", temperature: 0}
  gemma4-26b: {model: "ollama:gemma4:26b", temperature: 0}
