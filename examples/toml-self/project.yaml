# Self-supervised development (docs/design/self-supervised.md): TOML again, from the same stub, with the same spec
# and models as examples/toml/project.yaml (100% for $2.44), but with no tests shown. All 679 official tests are
# held out and only scored. The planner splits the task by spec section; before each step, a check writer on
# another model family writes checks that need no hand-computed answers (round trips, equivalent documents, rules
# the spec states); the builder may dispute a check by quoting the spec, and a referee of a third family rules.
#   uv run agentswarm import-toml ~/agentswarm-data/toml/toml-test --out ~/agentswarm-data/toml/self --hide-all
#   uv run agentswarm run examples/toml-self/project.yaml --root ~/agentswarm-runs/toml-self --max-rounds 120 \
#     --task "Implement the TOML 1.0.0 parser in tomlparse, as docs/toml-v1.0.0.md specifies it"
project: toml-self
domain: software
north_star: >-
  A TOML 1.0.0 parser in pure Python: the package tomlparse, whose loads(document) returns the same Python values
  as the standard library's tomllib and raises TOMLDecodeError for every invalid document, exactly as the TOML
  1.0.0 specification in docs/toml-v1.0.0.md states. No tests with known answers are given: done when the
  specification is implemented.
seed: ~/agentswarm-data/toml/self/seed
levels: [raw, experimental]
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}
models:
  # Three families, so no one checks its own kind's work: Anthropic plans and writes the checks, OpenAI (and the
  # local Gemma) builds, DeepSeek referees.
  planner: {model: "anthropic:claude-sonnet-5-5", max_tokens: 16384, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}}
  checker: {model: "anthropic:claude-sonnet-5-5", max_tokens: 32768, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.2, cache_write: 2.5}}
  gemma26: {model: "ollama:gemma4:26b", temperature: 0, max_tokens: 16384, timeout_s: 900, context_window: 65536}
  gpt-sol: {model: "openai:gpt-6.1-sol", max_tokens: 32768, usd_per_million: {input: 2.0, output: 10.0, cache_read: 0.1}}
  referee: {api_key_env: OPENROUTER_API_KEY, base_url: 'https://openrouter.ai/api/v1', max_tokens: 16384, model: 'openai:deepseek/deepseek-v4-pro-0813', usd_per_million: {cache_read: 0.022, input: 0.66, output: 1.98}}
checks:
  spec: {command: [python, -m, pytest, -q, -p, "no:cacheprovider"], kind: test_failure, timeout_s: 300, failure_exit_codes: [1], ratchet: experimental, protected: [tests/acceptance/]}
  # Python's standard library has a TOML parser; using it (or any other) would solve the task without doing it.
  own-parser:
    kind: inconsistent
    failure_exit_codes: [1]
    timeout_s: 30
    command:
      - python
      - -c
      - |
        import pathlib, re, sys
        banned = re.compile(r"^\s*(import|from)\s+(tomllib|tomli|tomlkit|toml|pytoml|rtoml|qtoml)\b", re.M)
        found = [str(p) for p in pathlib.Path("tomlparse").rglob("*.py") if banned.search(p.read_text())]
        for path in found:
            print(f"{path}: imports a TOML library; write the parser yourself, with the standard library otherwise")
        sys.exit(1 if found else 0)
  layout:
    kind: inconsistent
    failure_exit_codes: [1]
    timeout_s: 30
    command:
      - python
      - -c
      - |
        import pathlib, sys
        allowed = sys.argv[1:]
        stray = sorted(p.name for p in pathlib.Path(".").iterdir() if not p.name.startswith(".") and p.name not in allowed)
        for name in stray:
            print(f"{name}: outside the project layout (only {', '.join(allowed)} belong at the root); delete it")
        sys.exit(1 if stray else 0)
      - tomlparse
      - tests
      - docs
teams:
  - {use: decomposer, watches: raw, model: planner, split_below: 0.7, max_depth: 2, build_at_max_depth: true}
  - {use: acceptance_tester, watches: raw, model: checker, derived: true, checks: [spec]}
  - use: executor
    watches: raw
    model_tiers: [gemma26, gpt-sol]  # ranked by the router; no Anthropic model, which writes the checks
    routing: {ledger: ~/agentswarm-data/routing.sqlite, target: 0.8, half_life_calls: 200, explore_usd: 1.0}
    checks: [spec, own-parser, layout]
    max_model_calls: 60
    attempts: 2
    climb: true
    split_on_failure: true
    repairs: 2
    partial: true
    referee: referee
    spec: [docs/toml-v1.0.0.md]
    constraints:
      - Use only the Python standard library, and no TOML library from it or anywhere else (tomllib included).
      - Keep the code in the tomlparse package, split into modules as it grows.
      - The TOML 1.0.0 spec is in docs/toml-v1.0.0.md; implement each rule the way it states it. Hidden tests check the rest.
      - The tests in tests/acceptance/ were written by another model from the spec and can be wrong. If one contradicts the spec, don't work around it; name it in `disputes` with the spec's exact words. A referee rules, and a test ruled wrong is skipped.
gates:
  - {from: raw, to: experimental, hard_checks: [spec, own-parser, layout]}
score: {check: spec, held_out: [~/agentswarm-data/toml/self/held_out]}  # all 679 tests, never shown
budgets: {usd_per_day: 5.0, reserve_usd: 0.3}  # 2026-10-12 (UTC): $5 for the first run without labels (approved)
supervisor: {stall_after_minutes: 60}
jev: {mode: shadow, active: ["size:*", "route:*"]}  # Jev decides whether the task is split: by spec section
