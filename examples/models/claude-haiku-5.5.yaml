# Claude Haiku 5.5 on Anthropic's own API (ANTHROPIC_API_KEY): until 2026-11-09 it went through OpenRouter, which
# adds its credit fee and cached nothing. Prices for prompts up to 100K tokens ($0.50 / $2.50 beyond, not modelled).
model: anthropic:claude-haiku-5-5
max_tokens: 65536
usd_per_million:
  input: 0.1
  output: 0.5
  cache_read: 0.01
  cache_write: 0.125
