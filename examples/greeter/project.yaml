# The greeter project on the software preset (agentswarm/core/presets/software.yaml), which supplies the
# levels raw -> experimental -> candidate -> production, the unit_tests check and the gates: a Jev judge
# out of raw, a release train to candidate that needs both analyzers' sign-offs, a human production gate.
# `uv run agentswarm config examples/greeter/project.yaml` prints the result.
#
#   uv run agentswarm run examples/greeter/project.yaml --root ~/agentswarm-runs/greeter \
#       --task "Add a function farewell(name) that returns 'Goodbye, <name>!', with tests"
project: greeter
domain: software
north_star: A small, well-tested Python greeting library.
seed: seed

# Checks run in Docker, isolated. The --root directory must be one Docker can mount (anywhere under
# $HOME with Colima or Docker Desktop). Build the image once with
#   docker build -t agentswarm/sandbox-python:3.13 -f docker/sandbox-python.Dockerfile docker
sandbox: {kind: docker, image: "agentswarm/sandbox-python:3.13"}

models:
  # Any LangChain provider works; install its extra (uv sync --extra ollama|openai|anthropic).
  # The model must make real tool calls: qwen2.5-coder on Ollama writes them as plain text instead.
  coder: {model: "ollama:gemma4:e4b", temperature: 0}

# Replaces the preset's teams (key by key: listing teams replaces them all), to add constraints.
teams:
  - use: executor
    watches: raw
    model: coder
    checks: [unit_tests]
    max_model_calls: 30
    constraints:
      - Use only the Python standard library.
      - Put tests in tests/ and run them with run_checks.
  - {use: integration_tester, watches: experimental, model: coder, checks: [unit_tests], relevance: IntegrationRelevance}
  - {use: red_team, watches: experimental, model: coder, checks: [unit_tests], relevance: AdversarialRelevance}

jev: {mode: shadow}   # Jev judges and logs; nothing it says blocks or splits work yet (Phase 4)
